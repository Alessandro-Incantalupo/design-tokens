name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # Node and pnpm from mise.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contrast of every role pair
        run: pnpm contrast
      - name: tokens.json matches the CSS
        run: pnpm tokens:check
      - name: Package contents
        run: pnpm pack --dry-run
